topTitle: About Me
title: >
  ## A Bridge Between People and Technology
content: >
  ### With over 15 years of experience in curriculum design, public speaking instruction, and program evaluation, I specialize in helping professionals articulate their ideas with confidence and clarity.

  As a dedicated educator and academic leader, I have a proven ability to develop and implement innovative curricula that align with industry standards and promote engagement. My expertise lies in assessment methodologies, learning outcomes measurement, and faculty/student development.

  I hold a Doctorate in Education (Ed.S) with a focus on Adult Education and Curriculum Design, and I am a certified Neurolinguistic Practitioner. My passion is to act as a "translator," making complex concepts accessible and helping technical experts connect with their audience.
